## eSignet plugin configuration
#Comma separated list of third party packages to scan
mosip.esignet.integration.scan-base-package=io.mosip.esignet.plugin.mosipid
mosip.esignet.integration.authenticator=IdaAuthenticatorImpl
mosip.esignet.integration.key-binder=IdaKeyBinderImpl
mosip.esignet.integration.audit-plugin=IdaAuditPluginImpl

# IDA integration props
mosip.esignet.authenticator.ida-auth-id=mosip.identity.kycauth
mosip.esignet.authenticator.ida-exchange-id=mosip.identity.kycexchange
mosip.esignet.authenticator.ida-send-otp-id=mosip.identity.otp
mosip.esignet.authenticator.ida-version=1.0
mosip.esignet.authenticator.ida.misp-license-key=${mosip.esignet.misp.key}
mosip.esignet.authenticator.ida-domainUri=${mosip.esignet.domain.url}
mosip.esignet.ida.auth.url=${IDA_AUTH_URL:http://ida-auth.ida}
mosip.esignet.ida.otp.url=${IDA_OTP_URL:http://ida-otp.ida}
mosip.esignet.ida.internal.url=${IDA_INTERNAL_URL:http://ida-internal.ida}
mosip.esignet.authenticator.ida.cert-url=http://mosip-file-server.mosip-file-server/mosip-certs/ida-partner.cer
mosip.esignet.authenticator.ida.kyc-auth-url=${mosip.esignet.ida.auth.url}/idauthentication/v1/kyc-auth/delegated/${mosip.esignet.authenticator.ida.misp-license-key}/
mosip.esignet.authenticator.ida.kyc-auth-url-v2=${mosip.esignet.ida.auth.url}/idauthentication/v1/kyc-auth/v2/delegated/${mosip.esignet.authenticator.ida.misp-license-key}/
mosip.esignet.authenticator.ida.kyc-exchange-url=${mosip.esignet.ida.auth.url}/idauthentication/v1/kyc-exchange/delegated/${mosip.esignet.authenticator.ida.misp-license-key}/
mosip.esignet.authenticator.ida.kyc-exchange-url-v2=${mosip.esignet.ida.auth.url}/idauthentication/v1/kyc-exchange/v2/delegated/${mosip.esignet.authenticator.ida.misp-license-key}/
mosip.esignet.authenticator.ida.send-otp-url=${mosip.esignet.ida.otp.url}/idauthentication/v1/otp/${mosip.esignet.authenticator.ida.misp-license-key}/
mosip.esignet.binder.ida.key-binding-url=${mosip.esignet.ida.auth.url}/idauthentication/v1/identity-key-binding/delegated/${mosip.esignet.authenticator.ida.misp-license-key}/
mosip.esignet.authenticator.ida.get-certificates-url=${mosip.esignet.ida.internal.url}/idauthentication/v1/internal/getAllCertificates
mosip.esignet.authenticator.ida.auth-token-url=http://authmanager.kernel/v1/authmanager/authenticate/clientidsecretkey
mosip.esignet.authenticator.ida.audit-manager-url=http://auditmanager.kernel/v1/auditmanager/audits
mosip.esignet.authenticator.ida.client-id=mosip-ida-client
mosip.esignet.authenticator.ida.secret-key=${mosip.ida.client.secret}
mosip.esignet.authenticator.ida.app-id=ida
mosip.esignet.authenticator.ida-env=${IDA_AUTHENTICATOR_ENV:Staging}
mosip.esignet.authenticator.ida.otp-channels=email,phone

## Signup plugin configuration
mosip.signup.integration.impl.basepackage=io.mosip.signup.plugin.mosipid,io.mosip.kernel.cbeffutil.impl
mosip.kernel.xsdstorage-uri=classpath:
mosip.kernel.xsdfile=mosip-cbeff.xsd
mosip.signup.integration.profile-registry-plugin=MOSIPProfileRegistryPluginImpl
mosip.signup.idrepo.schema-url=http://masterdata.kernel/v1/masterdata/idschema/latest?schemaVersion=

mosip.signup.idrepo.url=${IDREPO_IDENTITY_URL:http://identity.idrepo}

mosip.signup.idrepo.get-identity.endpoint=${mosip.signup.idrepo.url}/idrepository/v1/identity/idvid/
mosip.signup.idrepo.identity.endpoint=${mosip.signup.idrepo.url}/idrepository/v1/identity/v2/
mosip.signup.idrepo.generate-hash.endpoint=http://keymanager.keymanager/v1/keymanager/generateArgon2Hash
mosip.signup.idrepo.get-uin.endpoint=http://idgenerator.kernel/v1/idgenerator/uin
mosip.signup.idrepo.get-status.endpoint=http://credentialrequest.idrepo/v1/credentialrequest/get/

# This is the url to fetch ui-spec from masterdata - 'esignet-signup' in the url should match with domain name of the schema in the masterdata.
mosip.signup.mosipid.get-ui-spec.endpoint=http://masterdata.kernel/v1/masterdata/uispec/esignet-signup/latest?type=schema&identitySchemaVersion=0.1
mosip.signup.mosipid.uispec.errors={required:{en:"This field is required"},passwordMismatch:{en:"Passwords is not matching please check your password"}}

mosip.signup.idrepo.add-identity.request.id=mosip.id.create
mosip.signup.idrepo.update-identity.request.id=mosip.id.update
mosip.signup.idrepo.identity.request.version=v1
mosip.signup.idrepo.mandatory-language=eng
mosip.signup.idrepo.optional-language=eng

## This is required for id-repo backward compatibility
mosip.signup.idrepo.get-identity-method=GET
mosip.signup.idrepo.get-identity-fallback-path=%s?type=demo

## Name of the json file which defines the identity verification process. Refer `mock-idv-user-story.json` for the structure.
mosip.signup.mock.identity-verification.story-name=mock-idv-user-story.json

## File defined in the property `mosip.signup.mock.identity-verification.story-name` is loaded with below defined URL
mosip.signup.mock.config-server-url=classpath:

## This property needs to removed in next release 1.7.0. Postfix needs to be added in the ui not backend
mosip.signup.individualid.postfix=@phone
